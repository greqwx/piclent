name: Bug report
description: Something works wrong or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. The more detail, the faster it gets fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before posting
      options:
        - label: I tried the latest release
          required: true
        - label: I searched existing issues and found nothing similar
          required: true

  - type: input
    id: version
    attributes:
      label: piclent version
      description: From the file properties of piclent.exe, or the installer name (piclent-1.2.0-setup.exe)
      placeholder: "1.2"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is Piclent installed?
      options:
        - Installer (piclent-VERSION-setup.exe)
        - Portable exe
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: format
    attributes:
      label: Image format
      description: "Only if the bug involves a specific file: jpg, png, gif, webp, bmp, other"
      placeholder: jpg

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images or videos straight into this field
