name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # one arch failing must not kill the other one mid-flight
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate syso (embed icon)
        shell: bash
        run: go run github.com/akavel/rsrc@v0.10.2 -arch ${{ matrix.goarch }} -ico assets/icon.ico

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: windows
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o piclent-${{ matrix.goarch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: piclent-${{ matrix.goarch }}
          path: piclent-${{ matrix.goarch }}.exe

  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: installer/payload
          merge-multiple: true

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dev'
          }

          $core = ($version -split '[-+]')[0]
          $parts = @($core -split '\.')
          $numeric = for ($i = 0; $i -lt 4; $i++) {
            if ($i -lt $parts.Count -and $parts[$i] -match '^\d+$') {
              [int]$parts[$i]
            } else {
              0
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$($numeric -join '.')" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        working-directory: installer
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_NUMERIC: ${{ steps.version.outputs.numeric }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppVersionNumeric=$env:APP_VERSION_NUMERIC" piclent.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: piclent-installer
          path: installer/Output/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          LINES=$(git log "$RANGE" --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" --no-merges)
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LINES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          files: dist/*.exe
