name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # one arch failing must not kill the other one mid-flight
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate syso (embed icon)
        shell: bash
        run: go run github.com/akavel/rsrc@v0.10.2 -arch ${{ matrix.goarch }} -ico assets/icon.ico

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: windows
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o piclent-${{ matrix.goarch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: piclent-${{ matrix.goarch }}
          path: piclent-${{ matrix.goarch }}.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          LINES=$(git log "$RANGE" --pretty=format:"- %s" --no-merges)
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LINES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          files: dist/*.exe
